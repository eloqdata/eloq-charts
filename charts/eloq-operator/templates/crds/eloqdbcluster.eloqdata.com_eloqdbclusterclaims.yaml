                    description: ExternalLB enables a public-facing load balancer
                      (accessible from the internet).
                    type: boolean
                  externalLBHostname:
                    description: |-
                      ExternalLBHostname is the DNS hostname used for external load balancer exposure.
                      Required when ExternalLB is enabled.
