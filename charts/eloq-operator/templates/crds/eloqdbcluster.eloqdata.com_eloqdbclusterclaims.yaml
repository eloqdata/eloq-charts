                  ExposeService controls optional load balancer exposure for this claim.
                  The operator always creates a claim-owned backend ClusterIP Service and,
                  when requested here, reconciles dedicated internal and external Gateway
                  load balancers on top of that backend.

                  For internalLB and externalLB, the hostname is the client-facing DNS name
                  covered by the shared certificate used by the per-claim Gateway listener.
                  TLS is intended to be mandatory for both load balancer exposure types.
                  When omitted, only the mandatory claim backend ClusterIP service is created.
