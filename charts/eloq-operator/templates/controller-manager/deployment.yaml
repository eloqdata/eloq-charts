{{- /*
Generated from eloq-operator/config/default via hack/sync_from_operator.py
The base structure comes from `kustomize build config/default`; Helm values only override install-time knobs.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eloq-operator.name" . }}-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: controller-manager
    {{- include "eloq-operator.commonLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "eloq-operator.selectorLabels" . | nindent 6 }}
      {{- include "eloq-operator.controlPlaneLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        {{- include "eloq-operator.selectorLabels" . | nindent 8 }}
        {{- include "eloq-operator.controlPlaneLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller-manager
    spec:
      {{- if .Values.controllerManager.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.controllerManager.nodeSelector | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.controllerManager.serviceAccount.name }}
      {{- with .Values.controllerManager.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 6 }}
      {{- end }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
                - arm64
                - ppc64le
                - s390x
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      securityContext:
        runAsNonRoot: true
      terminationGracePeriodSeconds: 10
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: {{ include "eloq-operator.name" . }}-webhook-server-cert
      containers:
      - name: manager
        image: {{ .Values.controllerManager.image.repository }}:{{ .Values.controllerManager.image.tag }}
        imagePullPolicy: {{ .Values.controllerManager.imagePullPolicy | default "IfNotPresent" }}
        command:
          - /manager
        args:
        - --health-probe-bind-address=:{{ .Values.controllerManager.healthPort }}
        - --metrics-bind-address=127.0.0.1:{{ .Values.controllerManager.metricPort }}
        {{- if .Values.controllerManager.watchNamespaces }}
        - --namespace={{ .Values.controllerManager.watchNamespaces }}
        {{- end }}
        - --crd-group=eloqdbcluster.eloqdata.com
        ports:
          - containerPort: 9443
            name: webhook-server
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.controllerManager.healthPort }}
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ .Values.controllerManager.healthPort }}
          initialDelaySeconds: 5
          periodSeconds: 10
        resources: {{- toYaml .Values.controllerManager.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
          - mountPath: /tmp/k8s-webhook-server/serving-certs
            name: cert
            readOnly: true
        env:
        - name: ENV_CERT_FILE_PATH
          value: /tmp/k8s-webhook-server/serving-certs
        - name: ENABLE_LEADER_ELECTION
          value: {{ .Values.controllerManager.enableLeaderElection | default true | quote }}
        - name: ENABLE_WEBHOOKS
          value: {{ .Values.controllerManager.enableWebhooks | default true | quote }}
        - name: ENABLE_RECONCILER
          value: {{ .Values.controllerManager.enableReconciler | default true | quote }}
        - name: KUBE_API_QPS
          value: {{ .Values.controllerManager.kubeApiQps | quote }}
        - name: KUBE_API_BURST
          value: {{ .Values.controllerManager.kubeApiBurst | quote }}
        - name: CACHE_SYNC_PERIOD
          value: {{ .Values.controllerManager.cacheSyncPeriod | quote }}
        - name: WATCH_NAMESPACE
          value: {{ .Values.controllerManager.watchNamespaces | quote }}
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: GATEWAY_NAMESPACE
          value: {{ .Values.controllerManager.gatewayNamespace | quote }}
        - name: CLUSTER_ISSUER
          value: {{ .Values.controllerManager.clusterIssuer | quote }}
        - name: GATEWAY_CLASS_NAME
          value: {{ .Values.controllerManager.gatewayClassName | quote }}
        - name: GATEWAY_NAME
          value: {{ .Values.controllerManager.gatewayName | quote }}
        - name: GATEWAY_CERTIFICATE_NAME
          value: {{ .Values.controllerManager.gatewayCertificateName | quote }}
        - name: GATEWAY_CERTIFICATE_SECRET_NAME
          value: {{ .Values.controllerManager.gatewayCertificateSecretName | quote }}
        - name: ENVOYPROXY_MIN_REPLICAS
          value: {{ .Values.controllerManager.envoyProxyMinReplicas | quote }}
        - name: ENVOYPROXY_MAX_REPLICAS
          value: {{ .Values.controllerManager.envoyProxyMaxReplicas | quote }}
        - name: DSYNC_IMAGE
          value: {{ .Values.controllerManager.dsyncImage | quote }}
        - name: REDIS_SHAKE_IMAGE
          value: {{ .Values.controllerManager.redisShakeImage | quote }}
        - name: GOOGLE_CLOUD_PROJECT
          value: {{ .Values.controllerManager.googleCloudProject | quote }}
        - name: GCP_PSC_VPC
          value: {{ .Values.controllerManager.gcpPscVpc | quote }}
        - name: GCP_DNS_PROJECT_ID
          value: {{ .Values.controllerManager.gcpDnsProjectId | quote }}
        - name: GCP_DNS_MANAGED_ZONE
          value: {{ .Values.controllerManager.gcpDnsManagedZone | quote }}
        - name: KUBERNETES_LIST_WATCH_LIST_ENABLED
          value: "false"
        - name: KUBE_FEATURE_WatchListClient
          value: "false"
      - name: kube-rbac-proxy
        image: quay.io/brancz/kube-rbac-proxy:v0.13.1
        imagePullPolicy: IfNotPresent
        args:
        - --secure-listen-address=0.0.0.0:8443
        - --upstream=http://127.0.0.1:{{ .Values.controllerManager.metricPort }}/
        - --logtostderr=true
        - --v=0
        ports:
          - containerPort: 8443
            name: https
            protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 5m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
