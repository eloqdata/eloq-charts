{{- /*
Generated from eloq-operator/config/webhook/manifests.yaml via hack/sync_from_operator.py
*/ -}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "eloq-operator.fullname" . }}-validating-webhook-configuration
  annotations:
    cert-manager.io/inject-ca-from: '{{ .Release.Namespace }}/{{ include "eloq-operator.name"
      . }}-serving-cert'
  labels:
    app.kubernetes.io/component: webhook
    {{- include "eloq-operator.commonLabels" . | nindent 4 }}
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "eloq-operator.name" . }}-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-eloqdbcluster-eloqdata-com-v1alpha1-eloqdbcluster
  failurePolicy: Fail
  name: veloqdbcluster.kb.io
  rules:
  - apiGroups:
    - eloqdbcluster.eloqdata.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - eloqdbclusters
  sideEffects: None
  timeoutSeconds: 1
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "eloq-operator.name" . }}-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-eloqdbcluster-eloqdata-com-v1alpha1-eloqdbclusterclaim
  failurePolicy: Fail
  name: veloqdbclusterclaim.kb.io
  rules:
  - apiGroups:
    - eloqdbcluster.eloqdata.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - eloqdbclusterclaims
  sideEffects: None
  timeoutSeconds: 1
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "eloq-operator.name" . }}-webhook-service
      namespace: {{ .Release.Namespace }}
      path: /validate-eloqdbcluster-eloqdata-com-v1alpha1-eloqdbclustertemplate
  failurePolicy: Fail
  name: veloqdbclustertemplate.kb.io
  rules:
  - apiGroups:
    - eloqdbcluster.eloqdata.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - eloqdbclustertemplates
  sideEffects: None
  timeoutSeconds: 1
