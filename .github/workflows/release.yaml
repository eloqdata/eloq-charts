name: Release EloqData Charts

# Automatic release on main branch push
# Manual release on other branches via workflow_dispatch (publishes dev versions)
on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - "hack/**"
      - ".github/workflows/release.yaml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Add Helm repositories
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Get commit SHA
        id: sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Read chart metadata
        id: chart
        run: |
          chart_version=$(grep '^version:' charts/eloq-operator/Chart.yaml | awk '{print $2}' | tr -d '"')
          app_version=$(grep '^appVersion:' charts/eloq-operator/Chart.yaml | awk '{print $2}' | tr -d '"')
          echo "CHART_VERSION=$chart_version" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$app_version" >> $GITHUB_OUTPUT

      - name: Resolve operator ref from appVersion
        id: operator_ref
        env:
          APP_VERSION: ${{ steps.chart.outputs.APP_VERSION }}
        run: |
          if git ls-remote --exit-code --tags https://github.com/monographdb/eloq-operator.git "refs/tags/v${APP_VERSION}" >/dev/null 2>&1; then
            echo "REF=v${APP_VERSION}" >> $GITHUB_OUTPUT
          elif git ls-remote --exit-code --tags https://github.com/monographdb/eloq-operator.git "refs/tags/${APP_VERSION}" >/dev/null 2>&1; then
            echo "REF=${APP_VERSION}" >> $GITHUB_OUTPUT
          else
            echo "Could not find tag for appVersion ${APP_VERSION} in monographdb/eloq-operator" >&2
            exit 1
          fi

      - name: Checkout operator source
        uses: actions/checkout@v4
        with:
          repository: monographdb/eloq-operator
          ref: ${{ steps.operator_ref.outputs.REF }}
          path: .operator-src
          fetch-depth: 1

      - name: Sync generated chart artifacts from operator appVersion
        run: python3 hack/sync_from_operator.py sync --operator-repo .operator-src

      - name: Ensure committed generated artifacts match appVersion
        run: python3 hack/sync_from_operator.py check-sync --operator-repo .operator-src

      - name: Verify synced chart
        run: python3 hack/sync_from_operator.py verify

      - name: Determine if main branch
        id: branch
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "IS_MAIN=true" >> $GITHUB_OUTPUT
          else
            echo "IS_MAIN=false" >> $GITHUB_OUTPUT
          fi

      - name: Package and Push All Charts to OCI Registry
        env:
          IS_MAIN: ${{ steps.branch.outputs.IS_MAIN }}
          SHORT_SHA: ${{ steps.sha.outputs.SHORT_SHA }}
        run: |
          for chart_dir in charts/*/; do
            if [ -f "${chart_dir}Chart.yaml" ]; then
              chart_name=$(basename "$chart_dir")
              echo "Processing chart: $chart_name"

              # Build dependencies
              helm dependency build "$chart_dir"

              if [ "$IS_MAIN" = "true" ]; then
                # Main branch: publish official release version
                VERSION=$(grep '^version:' "${chart_dir}Chart.yaml" | awk '{print $2}')
                echo "Using Chart.yaml version: $VERSION"
              else
                # Non-main branches (manual dispatch only): publish dev version
                VERSION="0.0.0-${SHORT_SHA}"
                echo "Using dev version: $VERSION"
              fi

              # Package and push
              helm package "$chart_dir" --version "$VERSION"
              chart_package="${chart_name}-${VERSION}.tgz"
              helm push "$chart_package" oci://ghcr.io/${{ github.repository_owner }}/charts

              echo "✅ Pushed $chart_name:$VERSION to ghcr.io/${{ github.repository_owner }}/charts"
            fi
          done

      - name: Package All Charts for GitHub Release
        env:
          IS_MAIN: ${{ steps.branch.outputs.IS_MAIN }}
          SHORT_SHA: ${{ steps.sha.outputs.SHORT_SHA }}
        run: |
          mkdir -p .release-packages
          for chart_dir in charts/*/; do
            if [ -f "${chart_dir}Chart.yaml" ]; then
              chart_name=$(basename "$chart_dir")

              if [ "$IS_MAIN" = "true" ]; then
                VERSION=$(grep '^version:' "${chart_dir}Chart.yaml" | awk '{print $2}')
              else
                VERSION="0.0.0-${SHORT_SHA}"
              fi

              helm package "$chart_dir" --version "$VERSION" -d .release-packages
              echo "✅ Packaged $chart_name:$VERSION for GitHub Release"
            fi
          done

      - name: Get versions for release
        if: github.ref == 'refs/heads/main'
        id: versions
        run: |
          chart_version=$(grep '^version:' charts/eloq-operator/Chart.yaml | awk '{print $2}')
          app_version=$(grep '^appVersion:' charts/eloq-operator/Chart.yaml | awk '{print $2}')
          echo "CHART_VERSION=$chart_version" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$app_version" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chart-v${{ steps.versions.outputs.CHART_VERSION }}
          name: Chart Release v${{ steps.versions.outputs.CHART_VERSION }}
          files: .release-packages/*.tgz
          generate_release_notes: true
          body: |
            ## EloqData Helm Charts Release (OCI/GHCR)

            **Commit**: ${{ github.sha }}
            **Branch**: main
            **Operator Source**: `monographdb/eloq-operator@${{ steps.operator_ref.outputs.REF }}`

            ### Chart Versions:
            - eloq-operator chart version: `${{ steps.versions.outputs.CHART_VERSION }}`
            - eloq-operator appVersion: `${{ steps.versions.outputs.APP_VERSION }}`

            ### Installation using OCI Registry (GHCR):

            ```bash
            # Authenticate
            export GITHUB_TOKEN=your_github_token
            echo $GITHUB_TOKEN | helm registry login ghcr.io -u your-username --password-stdin

            # Install eloq-operator
            helm install eloq-operator oci://ghcr.io/${{ github.repository_owner }}/charts/eloq-operator --version ${{ steps.versions.outputs.CHART_VERSION }}
            ```
